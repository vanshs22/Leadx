name: LeadX CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LEADX_ENFORCE_HASHED_LOCK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app services tests
      - run: pip install pip-audit==2.7.3 uv==0.10.0
      - name: Generate authoritative hashed dependency lock
        run: uv pip compile requirements.txt -o requirements.lock --generate-hashes --no-annotate
      - run: pip install -r requirements.lock
      - run: pip check
      - run: python scripts/check_migrations.py
      - run: python scripts/check_rls_coverage.py
      - run: python scripts/verify_runtime_schema.py
      - run: python scripts/check_plan_contract.py
      - run: python scripts/release_audit.py
      - run: pip-audit -r requirements.lock --strict
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: lead-crm-portal}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm', cache-dependency-path: lead-crm-portal/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm audit --audit-level=high
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --pull -t leadx-ci:${{ github.sha }} .
      - run: docker run -d --name leadx-health -e PORT=8000 -p 8000:8000 leadx-ci:${{ github.sha }}
      - run: for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health/ready && exit 0 || sleep 2; done; docker logs leadx-health; exit 1
