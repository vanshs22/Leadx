# Managed Lead Service — operator runs engine; clients use CRM portal
# Usage:
#   cp .env.example .env   # fill keys
#   docker compose up -d api worker portal
#   # optional LinkedIn sidecar when you have a li_at cookie:
#   docker compose up -d linkedin-scraper

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Deployment-specific values belong in .env; never force development
      # auth bypass or a local scraper URL from the compose file.
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LEAD_ENGINE_DEV_AUTH_BYPASS=${LEAD_ENGINE_DEV_AUTH_BYPASS:-0}
      - LINKEDIN_SCRAPER_URL=${LINKEDIN_SCRAPER_URL:-http://linkedin-scraper:8001}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REQUIRE_DISTRIBUTED_RATE_LIMIT=${REQUIRE_DISTRIBUTED_RATE_LIMIT:-0}
      # The supported local profile must not claim readiness without its data,
      # cache, worker, and queue capabilities.
      - REQUIRE_REDIS_FOR_API_READY=${REQUIRE_REDIS_FOR_API_READY:-1}
      - REQUIRE_WORKER_READY=${REQUIRE_WORKER_READY:-1}
      - PAID_PROVIDER_ISOLATION=${PAID_PROVIDER_ISOLATION:-0}
      - JOB_QUEUE_FAIL_CLOSED=${JOB_QUEUE_FAIL_CLOSED:-1}
      # Set to 1 ONLY when behind a reverse proxy you control (nginx/Caddy/Cloudflare)
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-0}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - LEADX_REQUIRE_EMAIL_VERIFICATION=${LEADX_REQUIRE_EMAIL_VERIFICATION:-false}
      - LOCAL_VALIDATION_MODE=${LOCAL_VALIDATION_MODE:-0}
      - LOCAL_AUTHENTICATION_FLAG=${LOCAL_AUTHENTICATION_FLAG:-0}
      - LOCAL_AUTH_EMAIL=${LOCAL_AUTH_EMAIL:-local@example.test}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-}
      - LOCAL_AUTH_PASSWORD_HASH=${LOCAL_AUTH_PASSWORD_HASH:-}
      - LOCAL_AUTH_SECRET=${LOCAL_AUTH_SECRET:-}
      - LOCAL_AUTH_USER_ID=${LOCAL_AUTH_USER_ID:-local-user}
      - LOCAL_AUTH_TENANT_ID=${LOCAL_AUTH_TENANT_ID:-local-tenant}
      - LEADX_PROCESS=api
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    volumes:
      - leadx-local-durable-data:/var/lib/leadx
    init: true
    stop_grace_period: 20s
    restart: "on-failure:5"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LEADX_REQUIRE_EMAIL_VERIFICATION=${LEADX_REQUIRE_EMAIL_VERIFICATION:-false}
      - LOCAL_VALIDATION_MODE=${LOCAL_VALIDATION_MODE:-0}
      - LOCAL_AUTHENTICATION_FLAG=${LOCAL_AUTHENTICATION_FLAG:-0}
      - LOCAL_AUTH_EMAIL=${LOCAL_AUTH_EMAIL:-local@example.test}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-}
      - LOCAL_AUTH_PASSWORD_HASH=${LOCAL_AUTH_PASSWORD_HASH:-}
      - LOCAL_AUTH_SECRET=${LOCAL_AUTH_SECRET:-}
      - LOCAL_AUTH_USER_ID=${LOCAL_AUTH_USER_ID:-local-user}
      - LOCAL_AUTH_TENANT_ID=${LOCAL_AUTH_TENANT_ID:-local-tenant}
      - LEADX_PROCESS=worker
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-3}
      # Keep the process alive across transient Supabase transport failures;
      # durable claim/transition code still fails closed and retries on recovery.
      - WORKER_QUEUE_FAILURE_POLICY=${WORKER_QUEUE_FAILURE_POLICY:-report_unready}
      - WORKER_HEARTBEAT_SECONDS=${WORKER_HEARTBEAT_SECONDS:-30}
      - WORKER_ID=${WORKER_ID:-leadx-worker}
    volumes:
      - leadx-local-durable-data:/var/lib/leadx
    init: true
    stop_grace_period: 20s
    restart: "on-failure:5"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_health.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  portal:
    build:
      context: ./lead-crm-portal
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: http://api:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_LEADX_LOCAL_AUTH: ${NEXT_PUBLIC_LEADX_LOCAL_AUTH:-0}
    ports:
      - "3000:3000"
    environment:
      # The service DNS name is required: loopback would resolve inside the
      # portal container and cannot reach the API container.
      API_UPSTREAM: http://api:8000
      LEADX_PORTAL_PROFILE: container
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_LEADX_LOCAL_AUTH: ${NEXT_PUBLIC_LEADX_LOCAL_AUTH:-0}
    init: true
    stop_grace_period: 20s
    restart: "on-failure:5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', { cache: 'no-store' }).then(async (response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  linkedin-scraper:
    profiles: ["linkedin"]
    build:
      context: ./services/linkedin-scraper
    ports:
      - "8001:8001"
    environment:
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      - CHROME_SINGLE_PROCESS=0
      - LINKEDIN_PAGE_WAIT=2.5
    restart: unless-stopped
    mem_limit: 1024m
    memswap_limit: 2048m
    shm_size: 64mb

  # Redis for distributed rate limits / queues
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: "on-failure:5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  leadx-local-durable-data:
