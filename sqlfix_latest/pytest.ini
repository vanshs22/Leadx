[pytest]
# Tests import real application modules as `backend.*`, so the package root
# must be importable. Previously each test file hand-rolled a
# sys.path.insert(...) and several then redefined the functions they were
# supposed to be testing, so the suite passed even when the app was broken.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
asyncio_mode = auto
markers =
    integration: requires a live Supabase/Postgres instance (deselect with -m "not integration")
filterwarnings =
    ignore::DeprecationWarning
